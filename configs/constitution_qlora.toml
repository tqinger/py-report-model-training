# QLoRA hyperparameters for Qwen/Qwen3-4B on the 11,610
# constitution-analysis JSON conversations in data/constitution-analysis.
# A per-device batch size of 2 with four accumulation steps yields an effective
# batch size of 8 while remaining suitable for a 16 GB GPU. The Qwen3-4B
# chat-template tokenization of the full dataset peaks at 507 tokens, so a
# 512-token context window retains every training target without padding to
# an unnecessarily large length.

[quantization]
load_in_4bit = true
bnb_4bit_quant_type = "nf4"
bnb_4bit_use_double_quant = true
bnb_4bit_compute_dtype = "bfloat16"
torch_dtype = "bfloat16"

[lora]
r = 16
alpha = 32
dropout = 0.05
target_modules = [
  "q_proj",
  "k_proj",
  "v_proj",
  "o_proj",
  "gate_proj",
  "up_proj",
  "down_proj",
]

[training]
seed = 20260811
max_length = 512
num_train_epochs = 3.0
learning_rate = 2e-5
lr_scheduler_type = "linear"
per_device_train_batch_size = 2
per_device_eval_batch_size = 2
gradient_accumulation_steps = 4
warmup_ratio = 0.03
max_grad_norm = 1.0
optim = "paged_adamw_8bit"
eval_strategy = "epoch"
save_strategy = "epoch"
logging_strategy = "steps"
logging_steps = 50
save_total_limit = 2
load_best_model_at_end = true
metric_for_best_model = "eval_loss"
greater_is_better = false
bf16 = true
tf32 = true
gradient_checkpointing = true
gradient_checkpointing_use_reentrant = false
report_to = "none"
