# QLoRA hyperparameters for Qwen/Qwen3-4B on the 11,610
# constitution-analysis JSON conversations in data/constitution-analysis.
# A 32 GB GPU can use a per-device batch size of 4 with two accumulation steps
# while preserving the established effective batch size of 8. The Qwen3-4B
# chat-template tokenization of the full dataset peaks at 507 tokens, so a
# 512-token context window retains every training target without padding to
# an unnecessarily large length.

[quantization]
load_in_4bit = true
bnb_4bit_quant_type = "nf4"
bnb_4bit_use_double_quant = true
bnb_4bit_compute_dtype = "bfloat16"
torch_dtype = "bfloat16"

[lora]
r = 16
alpha = 32
dropout = 0.05
target_modules = [
  "q_proj",
  "k_proj",
  "v_proj",
  "o_proj",
  "gate_proj",
  "up_proj",
  "down_proj",
]

[training]
seed = 20260811
max_length = 512
num_train_epochs = 3.0
learning_rate = 2e-5
# Decay on a half-cosine schedule to a 4e-6 floor rather than zero.
lr_scheduler_type = "cosine_with_min_lr"
lr_scheduler_kwargs = { min_lr_rate = 0.2 }
per_device_train_batch_size = 4
per_device_eval_batch_size = 4
dataloader_num_workers = 8
gradient_accumulation_steps = 2
warmup_ratio = 0.03
max_grad_norm = 1.0
# Avoid the bitsandbytes paged optimizer, which uses CUDA Unified Memory.
# Standard PyTorch AdamW removes that runtime path while retaining 4-bit QLoRA.
optim = "adamw_torch"
eval_strategy = "steps"
save_strategy = "steps"
logging_strategy = "steps"
logging_steps = 50
# Save a complete, resumable Trainer checkpoint every 200 optimizer steps.
# The newest recovery checkpoint replaces the previous one; a distinct best model is retained.
save_steps = 200
save_total_limit = 1
load_best_model_at_end = true
metric_for_best_model = "eval_loss"
greater_is_better = false
bf16 = true
tf32 = true
gradient_checkpointing = true
gradient_checkpointing_use_reentrant = false
report_to = "none"
