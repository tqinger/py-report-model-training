# QLoRA hyperparameters for Qwen/Qwen3-1.7B on the 76,320 cleaned conversations.
# Batch size 4 with accumulation 2 keeps the effective batch size at 8, matching
# the established 4B recipe while taking advantage of the smaller 4-bit base model.

[quantization]
load_in_4bit = true
bnb_4bit_quant_type = "nf4"
bnb_4bit_use_double_quant = true
bnb_4bit_compute_dtype = "bfloat16"
torch_dtype = "bfloat16"

[lora]
r = 16
alpha = 32
dropout = 0.05
target_modules = [
  "q_proj",
  "k_proj",
  "v_proj",
  "o_proj",
  "gate_proj",
  "up_proj",
  "down_proj",
]

[training]
seed = 20260803
max_length = 1024
num_train_epochs = 1.0
learning_rate = 3e-5
# During the scheduled training steps, decay on a half-cosine to a 6e-6 floor.
lr_scheduler_type = "cosine_with_min_lr"
lr_scheduler_kwargs = { min_lr_rate = 0.2 }
per_device_train_batch_size = 8
per_device_eval_batch_size = 8
dataloader_num_workers = 8
gradient_accumulation_steps = 1
warmup_ratio = 0.03
max_grad_norm = 1.0
optim = "paged_adamw_8bit"
eval_strategy = "steps"
save_strategy = "steps"
logging_strategy = "steps"
logging_steps = 50
# Save a complete, resumable Trainer checkpoint every 500 optimizer steps.
# The newest recovery checkpoint replaces the previous one; a distinct best model is retained.
save_steps = 500
save_total_limit = 1
load_best_model_at_end = true
metric_for_best_model = "eval_loss"
greater_is_better = false
bf16 = true
tf32 = true
gradient_checkpointing = true
gradient_checkpointing_use_reentrant = false
report_to = "none"
