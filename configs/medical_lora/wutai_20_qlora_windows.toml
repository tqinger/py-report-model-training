# QLoRA hyperparameters for local Windows training on the RTX 4060 Ti (16 GB).
# This preserves the server recipe's effective batch size of 8 while lowering
# the 2,048-token per-device batch size from 4 to 1 to fit the local GPU.
# Windows uses a single-process data loader to avoid worker-spawn overhead.

[quantization]
load_in_4bit = true
bnb_4bit_quant_type = "nf4"
bnb_4bit_use_double_quant = true
bnb_4bit_compute_dtype = "bfloat16"
torch_dtype = "bfloat16"

[lora]
r = 16
alpha = 32
dropout = 0.05
target_modules = [
  "q_proj",
  "k_proj",
  "v_proj",
  "o_proj",
  "gate_proj",
  "up_proj",
  "down_proj",
]

[training]
seed = 20260817
max_length = 2048
num_train_epochs = 5.0
learning_rate = 2e-5
lr_scheduler_type = "cosine_with_min_lr"
lr_scheduler_kwargs = { min_lr_rate = 0.2 }
per_device_train_batch_size = 1
per_device_eval_batch_size = 1
dataloader_num_workers = 0
gradient_accumulation_steps = 8
warmup_ratio = 0.05
max_grad_norm = 1.0
optim = "adamw_torch"
eval_strategy = "steps"
save_strategy = "steps"
logging_strategy = "steps"
logging_steps = 25
save_steps = 50
save_total_limit = 1
load_best_model_at_end = true
metric_for_best_model = "eval_loss"
greater_is_better = false
bf16 = true
tf32 = true
gradient_checkpointing = true
gradient_checkpointing_use_reentrant = false
report_to = "none"
