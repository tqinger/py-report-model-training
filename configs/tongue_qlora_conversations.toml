# QLoRA hyperparameters for the 101,760 synthetic tongue-analysis conversations
# in data/conversations. The sampled P95 conversation length is about 460 Chinese
# characters, so a 1024-token context window avoids unnecessary padding.

[quantization]
load_in_4bit = true
bnb_4bit_quant_type = "nf4"
bnb_4bit_use_double_quant = true
bnb_4bit_compute_dtype = "bfloat16"
torch_dtype = "bfloat16"

[lora]
r = 16
alpha = 32
dropout = 0.05
target_modules = [
  "q_proj",
  "k_proj",
  "v_proj",
  "o_proj",
  "gate_proj",
  "up_proj",
  "down_proj",
]

[training]
seed = 20260731
max_length = 1024
num_train_epochs = 1.0
learning_rate = 2e-5
per_device_train_batch_size = 2
per_device_eval_batch_size = 2
gradient_accumulation_steps = 4
warmup_ratio = 0.03
max_grad_norm = 1.0
optim = "paged_adamw_8bit"
eval_strategy = "epoch"
save_strategy = "epoch"
logging_strategy = "steps"
logging_steps = 50
save_total_limit = 2
load_best_model_at_end = true
metric_for_best_model = "eval_loss"
greater_is_better = false
bf16 = true
tf32 = true
gradient_checkpointing = true
gradient_checkpointing_use_reentrant = false
report_to = "none"
