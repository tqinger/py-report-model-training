# QLoRA hyperparameters for the supplied 1,980/20 five-state wellness SFT split.
# A 2,048-token context retains the sampled Qwen3 chat-template records (maximum 1,510 tokens).

[quantization]
load_in_4bit = true
bnb_4bit_quant_type = "nf4"
bnb_4bit_use_double_quant = true
bnb_4bit_compute_dtype = "bfloat16"
torch_dtype = "bfloat16"

[lora]
r = 16
alpha = 32
dropout = 0.05
target_modules = [
  "q_proj",
  "k_proj",
  "v_proj",
  "o_proj",
  "gate_proj",
  "up_proj",
  "down_proj",
]

[training]
seed = 20260817
max_length = 2048
num_train_epochs = 5.0
learning_rate = 2e-5
lr_scheduler_type = "cosine_with_min_lr"
lr_scheduler_kwargs = { min_lr_rate = 0.2 }
per_device_train_batch_size = 4
per_device_eval_batch_size = 4
gradient_accumulation_steps = 2
warmup_ratio = 0.05
max_grad_norm = 1.0
optim = "adamw_torch"
eval_strategy = "steps"
save_strategy = "steps"
logging_strategy = "steps"
logging_steps = 25
save_steps = 50
save_total_limit = 1
load_best_model_at_end = true
metric_for_best_model = "eval_loss"
greater_is_better = false
bf16 = true
tf32 = true
gradient_checkpointing = true
gradient_checkpointing_use_reentrant = false
report_to = "none"
