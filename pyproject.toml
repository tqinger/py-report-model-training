[project]
name = "tcm-qwen-evaluation"
version = "0.1.0"
description = "Reproducible Qwen3 QLoRA training and evaluation for tongue-analysis tasks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.7,<2",
    "bitsandbytes>=0.46,<1",
    "datasets>=3.6,<4",
    "huggingface-hub>=0.36,<1",
    "openpyxl>=3.1,<4",
    "peft>=0.15,<1",
    "psutil>=7,<8",
    "safetensors>=0.5,<1",
    "torch==2.7.1",
    "transformers>=4.51,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
