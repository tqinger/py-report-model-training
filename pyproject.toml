[project]
name = "tcm-qwen-evaluation"
version = "0.1.0"
description = "Reproducible Qwen3 baseline evaluation and QLoRA training for TCM text tasks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.7,<2",
    "bitsandbytes>=0.46,<1",
    "datasets>=3.6,<4",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "peft>=0.15,<1",
    "safetensors>=0.5,<1",
    "torch==2.7.1",
    "transformers>=4.51,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

